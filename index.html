<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Don't know where to go? Get somewhere new to run, walk, ride or drive to. No account, everything stays on your phone." />
  <title>Don't Know Where</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="map"></div>

  <div class="fabs">
    <button id="layer-btn" class="fab" type="button" data-i18n-attr="aria-label:map.style"><i data-icon="stack-2"></i></button>
    <button id="locate-btn" class="fab" type="button" data-i18n-attr="aria-label:map.me"><i data-icon="current-location"></i></button>
  </div>
  <div id="hr-pill" class="pill" hidden><i data-icon="heart"></i> <span id="hr-value">–</span></div>
  <div id="pick-banner" class="banner" hidden><span data-i18n="go.tapMap"></span><button type="button" id="pick-cancel" class="icon-btn small" data-i18n-attr="aria-label:trip.cancel"><i data-icon="x"></i></button></div>

  <!-- GO -->
  <section id="view-go" class="sheet view" data-view="go">
    <div class="grabber"></div>

    <div class="step" data-step="mode">
      <h1 class="title big" data-i18n="go.title"></h1>
      <button type="button" id="from-btn" class="from-row">
        <i data-icon="flag"></i>
        <span class="grow"><small data-i18n="go.from"></small> <b id="from-label"></b></span>
        <i data-icon="chevron-right"></i>
      </button>
      <div id="from-menu" class="panel" hidden>
        <div class="from-options">
          <button type="button" data-from="gps"><i data-icon="current-location"></i><span data-i18n="go.myLocation"></span></button>
          <button type="button" data-from="map"><i data-icon="map-pin"></i><span data-i18n="go.pickOnMap"></span></button>
        </div>
        <form id="from-search" class="search-row">
          <i data-icon="search"></i>
          <input id="from-query" class="input grow" type="search" autocomplete="off" data-i18n-attr="placeholder:go.searchPh" />
        </form>
        <div id="from-results" class="from-list"></div>
      </div>
      <p class="hint" id="location-status" hidden></p>
      <button type="button" id="usual-btn" class="usual" hidden></button>
      <div class="tiles" id="mode-picker"></div>
    </div>

    <div class="step" data-step="length" hidden>
      <div class="step-head">
        <button type="button" class="back" data-back="mode" data-i18n-attr="aria-label:go.back"><i data-icon="arrow-left"></i></button>
        <h1 class="title grow" data-i18n="go.howLong"></h1>
      </div>
      <div class="toggle" id="trip-type" role="radiogroup">
        <button type="button" data-loop="0" role="radio"><i data-icon="arrow-narrow-right"></i><span data-i18n="go.oneWay"></span></button>
        <button type="button" data-loop="1" role="radio"><i data-icon="repeat"></i><span data-i18n="go.loop"></span></button>
      </div>
      <div class="rows" id="length-picker"></div>
    </div>

    <div class="step" data-step="option" hidden>
      <div class="step-head">
        <button type="button" class="back" data-back="length" data-i18n-attr="aria-label:go.back"><i data-icon="arrow-left"></i></button>
        <h1 class="title grow" id="option-title"></h1>
      </div>
      <div class="rows" id="option-picker"></div>
    </div>

    <div class="step" data-step="results" hidden>
      <div class="step-head">
        <button type="button" class="back" data-back="option" data-i18n-attr="aria-label:go.back"><i data-icon="arrow-left"></i></button>
        <span class="grow"></span>
        <button type="button" class="icon-btn" id="reroll-btn" data-i18n-attr="aria-label:go.another"><i data-icon="dice-5"></i></button>
      </div>
      <div id="result-list" class="cards"></div>
      <button type="button" class="link-btn" id="more-btn" data-i18n="go.moreIdeas"></button>
    </div>

    <div class="step" data-step="loading" hidden>
      <div class="loading"><div class="spinner"></div><p id="loading-text"></p></div>
    </div>
  </section>

  <!-- TRIP -->
  <section id="view-trip" class="sheet view" data-view="trip" hidden>
    <div class="grabber"></div>
    <span class="label" id="trip-status"></span>
    <h2 class="title" id="trip-place"></h2>
    <div class="stats-grid three">
      <div class="stat"><span class="stat-v" id="trip-remaining">–</span><span class="stat-l" data-i18n="trip.toGo"></span></div>
      <div class="stat"><span class="stat-v" id="trip-elapsed">0:00</span><span class="stat-l" data-i18n="trip.time"></span></div>
      <div class="stat"><span class="stat-v" id="trip-speed">–</span><span class="stat-l" id="trip-speed-unit">km/h</span></div>
    </div>
    <a id="nav-main" class="btn full" target="_blank" rel="noopener"></a>
    <div class="alt-links" id="nav-alt"></div>
    <button id="finish-btn" class="btn primary full" type="button" data-i18n="trip.finish"></button>
    <div class="text-actions">
      <button id="here-btn" type="button" data-i18n="trip.here"></button>
      <button id="course-btn" type="button" data-i18n="trip.watch"></button>
      <button id="cancel-trip-btn" type="button" class="danger" data-i18n="trip.cancel"></button>
    </div>
  </section>

  <!-- RECAP -->
  <section id="view-recap" class="sheet view recap" data-view="recap" hidden>
    <div class="grabber"></div>
    <div class="step-head">
      <button type="button" class="back" id="recap-back" data-i18n-attr="aria-label:go.back"><i data-icon="arrow-left"></i></button>
      <div class="grow">
        <h1 class="title" id="recap-title"></h1>
        <span class="hint" id="recap-sub"></span>
      </div>
    </div>
    <div class="badges" id="recap-badges"></div>
    <div class="stats-grid three" id="recap-stats"></div>
    <div id="recap-charts"></div>
    <div class="legend" id="recap-legend"></div>
    <div class="row">
      <button id="recap-share" class="btn primary grow" type="button"><i data-icon="share"></i> <span data-i18n="recap.share"></span></button>
      <button id="recap-gpx" class="btn grow" type="button"><i data-icon="download"></i> GPX</button>
    </div>
    <div class="text-actions"><button id="recap-delete" type="button" class="danger" data-i18n="recap.delete"></button></div>
  </section>

  <!-- ACTIVITY -->
  <section id="view-activity" class="sheet view tall" data-view="activity" hidden>
    <div class="grabber"></div>
    <div class="step-head">
      <h1 class="title grow" data-i18n="act.title"></h1>
      <button id="import-btn" class="icon-btn" type="button" data-i18n-attr="aria-label:act.import"><i data-icon="upload"></i></button>
    </div>
    <div id="import-panel" class="panel" hidden>
      <p class="hint small" data-i18n="act.importHint"></p>
      <label class="btn full" for="import-file" data-i18n="act.chooseFile"></label>
      <input id="import-file" type="file" accept=".gpx,.tcx,.kml,.geojson,.json,application/gpx+xml,application/json" hidden multiple />
      <div class="row">
        <input id="import-link" class="input grow" type="url" data-i18n-attr="placeholder:act.linkPh" />
        <button id="import-link-btn" class="btn" type="button" data-i18n="act.add"></button>
      </div>
    </div>
    <button type="button" id="explore-row" class="explore-row" hidden>
      <span class="grow"><b id="explore-pct"></b><small id="explore-count"></small></span>
      <span class="link-btn" id="explore-toggle"></span>
    </button>
    <div id="history-summary" class="stats-grid three"></div>
    <div id="routes-block">
      <span class="label" data-i18n="act.saved"></span>
      <div id="routes-list" class="cards"></div>
    </div>
    <div id="history-list" class="cards"></div>
  </section>

  <!-- FRIENDS -->
  <section id="view-ranks" class="sheet view tall" data-view="ranks" hidden>
    <div class="grabber"></div>
    <div class="me-card">
      <span id="my-avatar" class="avatar"></span>
      <input id="nickname" class="input name-input grow" maxlength="32" data-i18n-attr="aria-label:ranks.nick" />
    </div>
    <div class="segmented four" id="board-picker"></div>
    <div id="board" class="board"></div>
    <div class="row">
      <button id="share-card-btn" class="btn primary grow" type="button" data-i18n="ranks.invite"></button>
      <button id="add-friend-btn" class="icon-btn" type="button" data-i18n-attr="aria-label:ranks.addCode"><i data-icon="plus"></i></button>
    </div>
    <div id="add-friend-panel" class="row" hidden>
      <input id="friend-code" class="input grow" data-i18n-attr="placeholder:ranks.friendPh" />
      <button id="friend-add" class="btn" type="button" data-i18n="act.add"></button>
    </div>
    <p class="hint small" data-i18n="ranks.onlyTotals"></p>
  </section>

  <!-- ME -->
  <section id="view-me" class="sheet view tall" data-view="me" hidden>
    <div class="grabber"></div>
    <h1 class="title" data-i18n="me.title"></h1>
    <div id="records"></div>

    <details class="section">
      <summary data-i18n="me.language"></summary>
      <div class="chips" id="lang-picker"></div>
    </details>

    <details class="section">
      <summary data-i18n="me.watch"></summary>
      <div class="row between">
        <div><b data-i18n="me.hr"></b><br /><span class="hint small" id="hrm-status"></span></div>
        <button id="hrm-btn" class="btn" type="button"></button>
      </div>
      <p class="hint small" data-i18n="me.hrHint1"></p>
      <p class="hint small" data-i18n="me.hrHint2"></p>
    </details>

    <details class="section">
      <summary data-i18n="me.calSection"></summary>
      <div class="row wrap">
        <label class="mini"><span data-i18n="me.weight"></span> <input id="p-weight" class="input" type="number" min="25" max="250" inputmode="numeric" /> kg</label>
        <label class="mini"><span data-i18n="me.age"></span> <input id="p-age" class="input" type="number" min="10" max="100" inputmode="numeric" /></label>
        <label class="mini"><span data-i18n="me.sex"></span>
          <select id="p-sex" class="input"><option value="">–</option><option value="f" data-i18n="me.f"></option><option value="m" data-i18n="me.m"></option></select>
        </label>
      </div>
    </details>

    <details class="section">
      <summary data-i18n="me.mapsApp"></summary>
      <div class="chips" id="provider-picker"></div>
    </details>

    <details class="section">
      <summary data-i18n="me.data"></summary>
      <p class="hint small" data-i18n="me.noAccount"></p>
      <div class="row wrap">
        <button id="export-btn" class="btn" type="button" data-i18n="me.backup"></button>
        <button id="clear-btn" class="btn ghost danger" type="button" data-i18n="me.deleteAll"></button>
      </div>
    </details>
    <p class="hint small credits" data-i18n="me.credits"></p>
  </section>

  <nav class="tabbar">
    <button type="button" data-tab="go" class="active" id="tab-go"><i data-icon="compass"></i><span data-i18n="tab.go"></span></button>
    <button type="button" data-tab="activity"><i data-icon="chart-line"></i><span data-i18n="tab.activity"></span></button>
    <button type="button" data-tab="ranks"><i data-icon="trophy"></i><span data-i18n="tab.friends"></span></button>
    <button type="button" data-tab="me"><i data-icon="user"></i><span data-i18n="tab.me"></span></button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
